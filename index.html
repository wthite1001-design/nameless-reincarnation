function eraKey(){
 if(typeof S!=='undefined'&&Number.isFinite(S.year)){
   if(S.year<2200)return'modern';
   if(S.year<2500)return'early';
   return'future'
 }
 return'modern'
}
function builtInFor(scene){
 const e=eraKey();
 const pick=(group,key=e)=>builtInScenes[group][key]||builtInScenes[group].modern||builtInScenes[group].early||Object.values(builtInScenes[group])[0];
 if(scene==='archive'||scene==='museum')return pick('archive');
 if(scene==='shop')return pick('medical');
 if(scene==='tower'||scene==='grave')return pick('tower');
 if(scene==='work')return pick('work');
 if(scene==='home'||scene==='room'||scene==='dining')return pick('dining',e==='future'?'modern':e);
 if(scene==='market'||scene==='street'||scene==='rain')return pick('dining',e==='future'?'modern':e);
 if(scene==='river')return pick('tower',e);
 return pick('dining','modern')
}

['room','春天的第一個早晨','窗外有人推著早餐攤經過。今天沒有什麼大事。\\n\\n老闆下午才需要你到藥店幫忙，上午完全屬於自己。',['再睡一下','你醒來時已經接近中午。難得什麼都沒有耽誤，只是錯過了早餐。',{daily:2}],['去街上吃早餐','你在熟悉的小攤坐下。老闆娘記得你不要蔥，還多塞了一塊餅給你。',{daily:4,money:-2}]],
['street','街角的新鄰居','搬貨的人把整條巷子堵得亂七八糟。一個陌生女孩抱著紙箱，差點撞上你。\\n\\n「抱歉！我剛搬來。」',['幫她把箱子扶好','你順手幫她把箱子搬到門口。她叫米婭，住得離你不遠。',{daily:4},'met_mia'],['只是讓開道路','你點點頭，讓她先過。這只是普通的一次擦肩。',{daily:1}]],
['shop','忙碌的午後','藥店今天來了不少人。老闆一邊整理藥材，一邊抱怨你切藥草切得太慢。\\n\\n「再這樣下去，晚飯都別吃了。」',['認真把工作做完','你一直忙到夕陽落下。老闆嘴上嫌棄，最後還是多算了工錢。',{daily:3,money:7}],['偷偷提早溜走','你從後門溜了。今晚多出一段完全屬於自己的時間。',{daily:2,money:-2}]],
['market','休假的市集','今天不用工作。市集裡有賣花的、唱歌的、吵架的，還有人正在猜杯子底下藏著哪顆豆子。',['花點錢玩一輪','你輸掉兩枚銀幣，卻莫名其妙和旁邊的人笑成一團。',{daily:4,money:-2}],['把錢留下來','你只是逛了一圈。回家時口袋裡的錢一枚也沒少。',{daily:2}]],
['river','河岸上的少年','送藥途中，你看見一名少年跪在泥地，手裡攥著被扯斷的錢袋。\\n\\n遠處有人喊著抓賊。少年喘著氣說：「我妹妹快死了。」',['把他交給追來的人','你叫住追來的人。少年被帶走以前看了你很久。\\n\\n當下，你只覺得自己做了應該做的事。',{daily:-1},'river_caught'],['替他付藥錢','你把今天的工錢塞進他手裡。少年愣住，最後只說了一聲謝謝。\\n\\n你沒有問他的名字。',{daily:4,money:-10},'river_help']],
['home','晚飯桌上的小事','今天的湯有點鹹。家裡的人互相推卸到底是誰多放了一匙鹽。\\n\\n窗外很安靜。',['加入這場無聊的爭論','最後誰也沒承認，但你們把整鍋湯吃完了。',{daily:5}],['吃完就回房間','你還有自己的事情要做。這只是再普通不過的一晚。',{daily:1}]],
['street','一場突然的大雨','你沒帶傘。屋簷下已經擠了好幾個陌生人。米婭站在另一頭，看見你後朝你揮手。',['跑過去和她一起躲雨','你們聊到雨停。她說自己其實很怕雷，但剛才一次都沒表現出來。',{daily:5},'mia_close'],['冒雨跑回家','鞋子全濕了。第二天你還因此打了好幾個噴嚏。',{daily:1}]],
['shop','老闆的舊木盒','打掃倉庫時，你翻到一只很舊的木盒。老闆說是前任店主留下的垃圾，讓你自己決定怎麼處理。',['留下來裝自己的東西','你在盒底刻下一道很小的記號。以後如果看到，你一定認得。',{daily:2},'woodbox'],['直接丟掉','它只是個舊盒子。你把它扔進後巷。',{daily:1}]],
['river','河邊的約定','傍晚，你和熟人坐在河堤上。對方突然問：「你有想過十年後會在哪嗎？」',['說一個很普通的未來','「大概還在這裡吧。」你笑了。當時的你真的相信未來會這麼普通。',{daily:5},'ordinary_future'],['說想離開白河','你望著河流下游。世界應該比這座城大得多。',{daily:2},'leave_dream']],
['home','沒有預兆的一天','早晨和平常完全一樣。\\n\\n你甚至已經想好晚上要吃什麼。\\n\\n沒有人知道，這會是你最後一個普通的早晨。',['照原本的安排出門','你關上門，走進熟悉的街道。',{daily:2},'last_normal'],['臨時留下來陪家人','你晚了半個時辰才出門。這個微小的改變，讓很多事情跟原本不一樣。',{daily:5},'last_delay']]
];
const second=[
['room','陌生人生的清晨','你從一場很長的夢裡醒來。夢裡似乎有河水，但睜眼後什麼都記不得。\\n\\n今天是學院開學日。',['趕快起床','你沒有把夢放在心上。新的生活已經夠忙了。',{daily:4}],['躺一下回想夢境','只記得一種奇怪的熟悉感。除此之外，什麼都沒有。',{memory:1}]],
['street','第一次既視感','你第一次走進這條老街，腳步卻在岔路前自然轉向右邊。\\n\\n走了幾步你才發現：你根本不知道右邊有什麼。',['當作方向感很好','你笑自己想太多，轉身去學院。',{daily:3}],['沿著路繼續走','路的盡頭是一家早已歇業的藥店。你站在門口很久。',{memory:3},'first_dejavu']],
['museum','一只不起眼的木盒','校外課程來到博物館。玻璃櫃裡有一只百年前的木盒。\\n\\n你盯著盒底的一道刮痕，心臟忽然跳得很快。',['不要胡思亂想','一只木盒而已。你跟著同學離開展廳。',{daily:3,memory:-1}],['問館員它的來源','館員說，它來自白河舊藥店。你從沒去過那裡，卻知道盒子原本放在哪個櫃子。',{memory:5,anomaly:1},'box_memory']],
['river','夢裡的河岸','你站在河岸時突然頭痛。\\n\\n一個不屬於你的畫面閃過：泥地、破掉的錢袋、少年伸出的手。',['立刻離開','你不喜歡這種感覺。回到熱鬧的街區後，頭痛慢慢消失。',{daily:2,memory:-1}],['閉上眼睛繼續回想','畫面只有幾秒，但你確定那不是想像。因為你甚至聞到了藥草味。',{memory:5,anomaly:2},'river_memory']],
['archive','一個死去很久的人','你查到舊藥店學徒的資料。\\n\\n姓名：黎安。\\n\\n死亡時間距離你的出生超過八十年。\\n\\n看到照片時，你卻產生一種荒謬的念頭：那是我。',['關掉資料','這太荒唐了。你不想因為幾場夢把自己弄瘋。',{daily:3,memory:-2}],['把資料抄下來','你第一次認真記下一個不屬於自己的名字。',{memory:6,anomaly:3},'knows_firstlife']]
];
const later=[
['archive','前世不是夢','第三次人生裡，你終於累積了足夠多互相吻合的資料。\\n\\n不同年代、不同姓名、不同家庭。唯一共同點是那些只有你知道的記憶。',['接受輪迴存在','你第一次正式把「前世」兩個字寫進筆記。',{memory:7,anomaly:3},'accept_rebirth'],['繼續否認','你把所有資料鎖起來。至少現在，你仍想只當這一世的自己。',{daily:4,memory:-3}]],
['market','回到過去的鑰匙','你再次找到那只木盒。這一次，碰到它時周圍的聲音全部消失。\\n\\n你看見第一世的白河，就在一步之外。',['鬆開手','能回去，不代表應該回去。',{intervene:-3,daily:3}],['踏進那段時間','你真的回到了第一世。更可怕的是——年輕的黎安仍然存在。',{intervene:7,anomaly:6},'first_intervention']],
['tower','第零世的門','很多世以後，你找到一份比「第一世」更早的死亡紀錄。\\n\\n最後一句話是：「下一次，請不要再叫自己黎安。」',['到這裡就好','你轉身離開。答案仍在門後，但人生也仍在門外。',{daily:6,anomaly:-4}],['打開門','你終於知道：第一世不是開始，而是你第一次成功忘掉一切。',{memory:8,anomaly:9},'zero_truth']]
];
function fresh(){return{setup:false,playerName:'',gender:'',life:0,year:2026,age:16,birthYear:2010,dead:null,day:1,slot:0,total:1,index:0,r:{daily:50,memory:0,intervene:0,anomaly:0},money:36,flags:{},images:{},history:[],log:[],result:null}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ev(){let pool=S.life===0?first:S.life===1?second:later;return pool[S.index%pool.length]}
function unlocked(k){if(k==='daily')return true;if(k==='memory')return S.life>=1&&(S.flags.first_dejavu||S.flags.box_memory||S.r.memory>0);if(k==='anomaly')return S.life>=1&&S.r.anomaly>0;if(k==='intervene')return S.life>=2&&S.flags.accept_rebirth}
function state(v){return v<=15?'極低':v<=35?'偏低':v<65?'平衡':v<85?'偏高':'極高'}
function head(){
 let names=[['日常','daily'],['追憶','memory'],['干預','intervene'],['異常','anomaly']];
 let visible=S.life===0?names.slice(0,1):names.filter(([n,k])=>k==='daily'||unlocked(k));
 $('routes').innerHTML=visible.map(([n,k])=>`<div><div class="rh"><span>${n}</span><span>${S.r[k]}</span></div><div class="track"><div class="fill" style="width:${S.r[k]}%"></div></div><div class="state">${state(S.r[k])}</div></div>`).join('');
 $('life').textContent=`第 ${S.life+1} 世・${S.playerName||''}`;
 $('date').textContent=`西元 ${S.year} 年・${S.age} 歲　銀幣 ${S.money}`;
}
function cleanText(v){
 return String(v??'').replace(/\\n/g,'\n').replace(/\n{3,}/g,'\n\n');
}
function image(scene,result=false){let im=result?$('ri'):$('img'),fb=result?$('rf'):$('fallback'),data=builtInFor(scene);if(data){
 im.onerror=()=>{im.classList.add('hidden');fb.classList.remove('hidden');fb.textContent=placeNames[scene]||'生活場景'};
 im.onload=()=>{im.classList.remove('hidden');fb.classList.add('hidden')};
 im.src=data
}else{im.classList.add('hidden');fb.classList.remove('hidden');fb.textContent=placeNames[scene]||'生活場景'}}
function show(){head();if(S.result){showResult();return}let e=ev();$('card').classList.remove('hidden');$('result').classList.add('hidden');$('place').textContent=placeNames[e[0]];$('tag').textContent=S.life===0?'這一世的生活':S.life===1?'似曾相識':'輪迴中的一天';$('title').textContent=e[1].replaceAll('黎安',S.playerName||'黎安');$('story').textContent=cleanText(e[2].replaceAll('黎安',S.playerName||'黎安'));if(e[1]==='白色身影'){$('story').insertAdjacentHTML('afterend',`<div class="godNpc" id="godNpcCard"><img src="${GOD_NPC.image}" alt="神明貓貓"><div class="godNpcText"><div class="godNpcName">神明貓貓</div><div class="godNpcDesc">此時的你只知道，她是一個奇怪的陌生人。</div></div></div>`)}else{let g=$('godNpcCard');if(g)g.remove()}$('lb').textContent='← '+e[3][0];$('rb').textContent=e[4][0]+' →';$('lp').textContent=e[3][0];$('rp').textContent=e[4][0];image(e[0]);resetCard();log()}
function apply(d){for(let k of ['daily','memory','intervene','anomaly'])if(d[k])S.r[k]=clamp(S.r[k]+d[k]);if(d.money)S.money=Math.max(0,S.money+d.money)}
function choose(side){let e=ev(),o=side==='l'?e[3]:e[4];apply(o[2]||{});if(o[3])S.flags[o[3]]=true;S.result={label:o[0],text:o[1],delta:o[2]||{},scene:e[0]};S.log.unshift({day:S.day,label:o[0],text:o[1].split('\n')[0]});S.log=S.log.slice(0,7);save();show()}
function showResult(){let x=S.result;$('card').classList.add('hidden');$('result').classList.remove('hidden');$('chosen').textContent=x.label;$('resultText').textContent=cleanText(x.text.replaceAll('黎安',S.playerName||'黎安'));image(x.scene,true);let map={daily:'日常',memory:'追憶',intervene:'干預',anomaly:'異常',money:'銀幣'};$('deltas').innerHTML=Object.entries(x.delta).filter(([k,v])=>v&&unlocked(k)).map(([k,v])=>`<div class="delta">${map[k]||k}　${v>0?'+':''}${v}</div>`).join('')||'<div class="delta">這次沒有可見的數值變化</div>';head();log()}
function oldAgeDeath(){
 if(S.age<60)return false;
 let p=.025+(S.age-60)*.017;
 if(S.age>=90)p+=.12;
 return Math.random()<Math.min(.72,p)
}
function die(cause){
 S.dead={cause:cause,year:S.year,age:S.age,name:S.playerName,gender:S.gender,birth:S.birthYear};
 save();showDeath()
}
function showDeath(){
 $('deathOverlay').classList.remove('hidden');
 $('deathName').textContent=`${S.playerName}，${S.gender}`;
 $('deathDates').textContent=`西元 ${S.birthYear}－${S.year}　享年 ${S.age} 歲`;
 $('deathCause').textContent=`死因：${S.dead.cause}`
}
function next(){
 let dangerous=S.result&&S.result.label;
 S.result=null;
 // A few choices are hidden instant-death risks; the option itself does not reveal this.
 if(dangerous&&/冒雨|繼續往下|踏進|沿著路/.test(dangerous)&&Math.random()<.12){die('意外死亡');return}
 S.year+=2;S.age+=2;S.day++;S.total++;S.index++;
 if(S.year>=3026){
 let ei=0;
 if(S.r.memory>=85&&S.r.intervene>=85&&S.r.anomaly>=85&&S.flags.met_god_maomao)ei=34;
 else if(S.flags.met_god_maomao&&S.r.memory>=75&&S.r.intervene>=70&&S.r.anomaly>=70&&S.life>=8)ei=30;
 else if(S.flags.met_god_maomao&&S.r.daily>=70&&S.r.memory>=55&&S.r.anomaly>=45&&S.life>=5)ei=27;
 else if(S.r.intervene>=85)ei=21;
 else if(S.r.memory>=85&&S.r.anomaly>=65)ei=20;
 else if(S.r.memory<=15)ei=19;
 else if(S.r.daily>=85)ei=0;
 else ei=Math.min(33,Math.max(0,(S.life*7+Math.floor(S.r.memory/20)+Math.floor(S.r.intervene/20))%34));
 unlockEnding(ei);save();alert(`西元 3026 年。\n結局：${ENDINGS[ei][0]}\n\n已加入結局收藏。`);renderCollection();$('collectionOverlay').classList.remove('hidden');return
}
 if(oldAgeDeath()){die('自然老死');return}
 save();show()
}
function log(){$('log').innerHTML=S.log.length?S.log.map(x=>`<div class="li">第 ${x.day} 日　${x.label}<br>${x.text}</div>`).join(''):'<div class="li">這一世才剛開始。</div>'}
function past(){$('pastList').innerHTML=S.life===0?'<div class="entry"><p>現在的你沒有「前世」這個概念。</p></div>':S.history.map((x,i)=>`<div class="entry"><strong>第 ${i+1} 世</strong><p>${x.summary}</p></div>`).join('')}
function causes(){let a=[];if(S.flags.river_help)a.push(['河岸上的援手','第一世，你曾替一個沒有留下姓名的少年付藥錢。']);if(S.flags.woodbox)a.push(['刻痕木盒','第一世，你在舊木盒底留下了一道只有自己認得的刻痕。']);if(S.flags.first_intervention)a.push(['第一次干預','你已經親自踏回第一世存在的年代。']);$('causeList').innerHTML=S.life===0?'<div class="entry"><p>第一世的你不知道什麼是因果。現在做過的事情，只是生活。</p></div>':a.length?a.map(x=>`<div class="entry"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join(''):'<div class="entry"><p>有些事情還沒有顯示它真正的後果。</p></div>'}
function switchV(v){['game','past','causes'].forEach(x=>$(x).classList.add('hidden'));$(v).classList.remove('hidden');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='past')past();if(v==='causes')causes()}
function resetCard(){let c=$('card');c.style.transform='';c.style.opacity=1;$('lp').style.opacity=0;$('rp').style.opacity=0}
let sx=0,dx=0,drag=false;$('card').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;sx=e.clientX;dx=0;$('card').setPointerCapture(e.pointerId);$('card').classList.add('drag')});$('card').addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;$('card').style.transform=`translateX(${dx}px) rotate(${dx/28}deg)`;let o=Math.min(Math.abs(dx)/90,1);$('lp').style.opacity=dx<0?o:0;$('rp').style.opacity=dx>0?o:0});$('card').addEventListener('pointerup',()=>{if(!drag)return;drag=false;$('card').classList.remove('drag');if(Math.abs(dx)>85){let side=dx<0?'l':'r';$('card').style.transform=`translateX(${dx<0?-520:520}px) rotate(${dx<0?-12:12}deg)`;$('card').style.opacity=0;setTimeout(()=>choose(side),160)}else resetCard()});
$('lb').onclick=()=>choose('l');$('rb').onclick=()=>choose('r');$('continue').onclick=next;
$('reset').onclick=()=>{if(confirm('確定刪除目前進度重新開始？')){S=fresh();localStorage.removeItem(KEY);selectedGender='';switchV('game');showSetup()}};
$('nextLife').onclick=()=>{
 S.history.push({life:S.life,name:S.playerName,gender:S.gender,birth:S.birthYear,death:S.year,cause:S.dead.cause});
 S.life++;S.dead=null;S.playerName='';S.gender='';S.age=16;S.birthYear=S.year-16;S.day=1;S.index=0;S.slot=0;S.log=[];S.r.daily=50;
 if(S.life===1)S.r.memory=1;
 selectedGender='';save();$('deathOverlay').classList.add('hidden');showSetup()
};

function getEndingArchive(){try{return JSON.parse(localStorage.getItem('nameless_endings_v1'))||[]}catch(e){return[]}}
function unlockEnding(i){let a=getEndingArchive();if(!a.includes(i)){a.push(i);localStorage.setItem('nameless_endings_v1',JSON.stringify(a))}}
function renderCollection(){
 let a=getEndingArchive();$('collectionCount').textContent=`已收集 ${a.length} / ${ENDINGS.length}`;
 $('collectionGrid').innerHTML=ENDINGS.map((e,i)=>a.includes(i)?`<button class="endingItem" data-ending="${i}"><div class="endingNo">ENDING ${String(i+1).padStart(2,'0')}</div><div class="endingName">${e[0]}</div><div class="endingDesc">${e[1]}</div></button>`:`<button class="endingItem locked" disabled><div class="endingNo">ENDING ${String(i+1).padStart(2,'0')}</div><div class="endingName">？？？</div><div class="endingDesc">尚未達成</div></button>`).join('');
 document.querySelectorAll('[data-ending]').forEach(b=>b.onclick=()=>{let e=ENDINGS[+b.dataset.ending];$('endingDetail').classList.remove('hidden');$('endingDetail').textContent=`${e[0]}\n\n${e[1]}`})
}
$('openCollection').onclick=()=>{renderCollection();$('collectionOverlay').classList.remove('hidden')};
$('closeCollection').onclick=()=>{$('collectionOverlay').classList.add('hidden');$('endingDetail').classList.add('hidden')};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>switchV(b.dataset.v));
let selectedGender=S.gender||'';
function showSetup(){$('setup').classList.remove('hidden');$('playerName').value=S.playerName||'';document.querySelectorAll('.genderBtn').forEach(b=>b.classList.toggle('active',b.dataset.gender===selectedGender))}
function hideSetup(){$('setup').classList.add('hidden')}
document.querySelectorAll('.genderBtn').forEach(b=>b.onclick=()=>{selectedGender=b.dataset.gender;document.querySelectorAll('.genderBtn').forEach(x=>x.classList.toggle('active',x===b))});
$('startGame').onclick=()=>{let n=$('playerName').value.trim();if(!n){alert('先寫下你的名字。');return}if(!selectedGender){alert('請選擇性別。');return}S.playerName=n;S.gender=selectedGender;S.setup=true;S.birthYear=S.year-S.age;save();hideSetup();show()};
if(S.dead)showDeath();else if(S.setup)show();else showSetup();
})();
</script></body></html>
