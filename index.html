function markExpiredCausalEvents(){
 for(const c of CAUSAL_EVENTS){
   if(S.year>c.to && !S.worldEvents[c.id]){
     S.worldEvents[c.id]={status:'missed',year:c.to};
   }
 }
}
function dueCausalEvent(){
 markExpiredCausalEvents();
 for(const c of CAUSAL_EVENTS){
   if(S.worldEvents[c.id]||S.flags['causal_done_'+c.id])continue;
   if(c.life!=null && S.life!==c.life)continue;
   if(S.year>=c.from && S.year<=c.to){
     if(c.id==='maomao_first')return {...c,event:godIntroEvent()};
     return c;
   }
 }
 return null;
}

function normalEventsForLife(){

 let out=[];
 NORMAL_EVENT_SEEDS.forEach((a,i)=>NORMAL_VARIANTS.forEach((v,j)=>{

   const left=JSON.parse(JSON.stringify([a[3],a[4],a[5]])),right=JSON.parse(JSON.stringify([a[6],a[7],a[8]]));
   if(j===1){left[2].memory=(left[2].memory||0)+1}

   out.push([a[0],`${a[1]}・${v[0]}`,`${v[1]}\n\n${era}的生活仍在向前，而你必須決定怎麼回應眼前這一刻。`,left,right,`normal_${n}`]);

}

function dueImportantEvent(){
 for(const x of IMPORTANT_EVENTS){if(S.life>=x.life&&S.day>=x.day&&!S.flags['important_done_'+x.id])return x}
 return null;
}
function ev(){
 const causal=dueCausalEvent();
 if(causal&&Array.isArray(causal.event)&&causal.event.length>=5)return causal.event;
 const important=dueImportantEvent();
 if(important)return important.event;
 const pool=normalEventsForLife();
 const key=String(S.life);S.seenNormal=S.seenNormal||{};S.seenNormal[key]=S.seenNormal[key]||[];
 let candidates=pool.filter(x=>!S.seenNormal[key].includes(x[5]));
 if(!candidates.length){S.seenNormal[key]=[];candidates=pool.slice()}
 return candidates[Math.abs(S.index)%candidates.length]||pool[0];
}

function apply(delta){
 delta=delta||{};
 for(const [k,v] of Object.entries(delta)){
   if(k==='money')continue;
   if(S.r && Object.prototype.hasOwnProperty.call(S.r,k)){
     S.r[k]=Math.max(0,Math.min(100,(Number(S.r[k])||0)+Number(v||0)));
   }
 }
}

function choose(side){
 const e=ev();
 if(!e || !Array.isArray(e) || e.length<5){resetCard();show();return}
 const o=side==='l'?e[3]:e[4];
 if(!o){resetCard();show();return}

 const activeCausal=dueCausalEvent();
 const activeImportant=!activeCausal?dueImportantEvent():null;
 apply(o[2]||{});
 if(o[3])S.flags[o[3]]=true;

 if(activeCausal){
   S.worldEvents[activeCausal.id]={
     status:'resolved',year:S.year,life:S.life,choice:side
   };
   S.flags['causal_done_'+activeCausal.id]=true;
 }
 if(activeImportant){S.flags['important_done_'+activeImportant.id]=true;}
 if(e[5]&&String(e[5]).startsWith('normal_')){const k=String(S.life);S.seenNormal[k]=S.seenNormal[k]||[];if(!S.seenNormal[k].includes(e[5]))S.seenNormal[k].push(e[5]);}

 S.recentEvents=S.recentEvents||[];
 S.recentEvents.push(e[1]);
 if(S.recentEvents.length>3)S.recentEvents.shift();

 S.result={
   label:o[0]||'你的選擇',
   text:cleanText(o[1]||'你的選擇改變了這一刻。'),
   delta:o[2]||{},
   scene:e[0],
    image:(activeCausal&&ORIGINAL_CAUSAL_SCENES[activeCausal.id])?ORIGINAL_CAUSAL_SCENES[activeCausal.id]:builtInFor(e[0])
 };

 S.log=S.log||[];
 S.log.unshift({
   day:S.day,
   label:o[0]||'你的選擇',
   text:cleanText(o[1]||'').split('\n')[0]
 });
 S.log=S.log.slice(0,7);

 resetCard();
 save();
 showResult();
}

// Lightweight original ambient soundtrack generated in-browser; no external audio file is required.
let audioCtx=null,musicMaster=null,musicTimer=null,musicOn=true,musicMood='life',musicStep=0,musicVolume=.55,pageAudioPaused=false;
function ensureMusic(){
 if(!musicOn)return;
 try{
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();musicMaster=audioCtx.createGain();musicMaster.gain.value=.055*musicVolume;musicMaster.connect(audioCtx.destination);scheduleMusic()}
  if(audioCtx.state==='suspended'&&!document.hidden)audioCtx.resume();
 }catch(e){}
}
function tone(freq,dur=.9,vol=.18,type='sine'){
 if(!audioCtx||!musicMaster||!musicOn)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
 o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.06);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(musicMaster);o.start(now);o.stop(now+dur+.05)
}
function scheduleMusic(){
 clearInterval(musicTimer);
 const life=[220,277.18,329.63,415.30,329.63,277.18,246.94,329.63];
 const death=[110,130.81,146.83,123.47,98,116.54,103.83,87.31];
 musicTimer=setInterval(()=>{if(!musicOn||!audioCtx||document.hidden)return;const seq=musicMood==='death'?death:life;const f=seq[musicStep++%seq.length];tone(f,musicMood==='death'?1.8:1.25,musicMood==='death'?.11:.13,musicMood==='death'?'triangle':'sine');if(musicStep%2===0)tone(f/2,2.2,.055,'sine')},musicMood==='death'?1150:820)
}
function setMusicMood(m){musicMood=m;if(audioCtx){scheduleMusic();if(m==='death'){musicMaster.gain.cancelScheduledValues(audioCtx.currentTime);musicMaster.gain.setTargetAtTime(.035*musicVolume,audioCtx.currentTime,.2)}else musicMaster.gain.setTargetAtTime(.055*musicVolume,audioCtx.currentTime,.3)}}
function updateMusicButton(){$('musicToggle').textContent=musicOn?'♫ 音樂':'♩ 靜音'}
$('musicToggle').onclick=()=>{musicOn=!musicOn;updateMusicButton();if(musicOn)ensureMusic();else if(audioCtx&&musicMaster)musicMaster.gain.setTargetAtTime(.0001,audioCtx.currentTime,.08)};
updateMusicButton();
const volumeEl=$('musicVolume');
if(volumeEl){
 volumeEl.value=Math.round(musicVolume*100);
 volumeEl.addEventListener('input',()=>{
  musicVolume=Math.max(0,Math.min(1,Number(volumeEl.value)/100));
  if(musicMaster&&audioCtx){const base=musicMood==='death'?.035:.055;musicMaster.gain.setTargetAtTime(base*musicVolume,audioCtx.currentTime,.05)}
 });
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){
  pageAudioPaused=true;
  clearInterval(musicTimer);musicTimer=null;
  if(audioCtx&&audioCtx.state==='running')audioCtx.suspend().catch(()=>{});
 }else if(pageAudioPaused){
  pageAudioPaused=false;
  if(musicOn){
   if(audioCtx)audioCtx.resume().then(()=>scheduleMusic()).catch(()=>{});
   else ensureMusic();
  }
 }
});
window.addEventListener('pagehide',()=>{clearInterval(musicTimer);musicTimer=null;if(audioCtx&&audioCtx.state==='running')audioCtx.suspend().catch(()=>{})});
window.addEventListener('pageshow',()=>{if(musicOn&&audioCtx&&!document.hidden)audioCtx.resume().then(()=>scheduleMusic()).catch(()=>{})});
document.addEventListener('pointerdown',()=>ensureMusic(),{once:true});
